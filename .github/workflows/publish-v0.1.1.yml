name: Publish LyriLayer v0.1.1 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.1.1.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: lyrilayer-publish-v0.1.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.1.1
      SOURCE_SHA: '2c01db54da9cd1ef7a2ec7a3e3e34f26150c0e0a'
    steps:
      - name: Retrieve successful build artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download 45380787480 --name LyriLayer-APK --dir dist
          test -s dist/LyriLayer-debug.apk
          unzip -tq dist/LyriLayer-debug.apk
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## 변경 사항
          - 삼성 통화녹음, 음성녹음, 벨소리, 알림음 및 알람을 음악 목록과 가사 검색 대상에서 제외합니다. 원본 파일은 삭제하지 않습니다.
          - LRCLIB 정확 일치, 제목/가수, 통합 키워드, 파일명 기반 다단계 검색을 지원합니다.
          - 검색 후보의 곡 정보와 재생 시간을 비교하고 싱크 가사를 우선합니다.
          - 기존 검색 실패 캐시 갱신, 오류 메시지 및 일괄 수집 통계 개선.
          - 사용자 편집 가사 보호 및 기존 데이터베이스 구조 유지.
          
          ## 설치 참고
          - Android 8.0 이상. Debug 서명 테스트 APK입니다.
          - 유닛 테스트 및 APK 빌드 성공. 삼성 갤럭시 실기기 검증은 아직 필요합니다.
          - 이전 APK와 서명이 다르면 업데이트 설치가 실패할 수 있습니다. 삭제 전 기존 가사 데이터 손실에 주의하세요.
          - Google 검색은 수동 보조 기능이며 자동 가사 검색은 LRCLIB를 사용합니다.
          
          Build: 45380787480 / commit 2c01db54da9cd1ef7a2ec7a3e3e34f26150c0e0a
          EOF
          gh release create "$TAG" dist/LyriLayer-debug.apk --target "$SOURCE_SHA" --title "LyriLayer v0.1.1" --notes-file release-notes.md --prerelease
          gh release view "$TAG" --json url,assets
