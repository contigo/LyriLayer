name: LyriLayer APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lyrilayer-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check APK signing configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LYRILAYER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LYRILAYER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Persistent development signing credentials required. Configure both signing secrets."
            exit 1
          fi
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build unsigned production AAB (Play upload key required before submission)
        run: gradle :app:bundleRelease --stacktrace
      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LYRILAYER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LYRILAYER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p artifacts
          umask 077
          KS="$(mktemp "$RUNNER_TEMP/lyrilayer-signing.XXXXXX")"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KS"
          "$TOOLS/apksigner" sign --ks "$KS" --ks-key-alias lyrilayer --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out artifacts/LyriLayer-dev.apk app/build/outputs/apk/debug/app-debug.apk
          CERT_INFO="$("$TOOLS/apksigner" verify --verbose --print-certs artifacts/LyriLayer-dev.apk)"
          printf '%s\n' "$CERT_INFO"
          ACTUAL="$(printf '%s\n' "$CERT_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          EXPECTED="7e179e25aaf7980cad8b94c12d1a172b5736260cd7d34fc31d568687be1f7e17"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::APK signing certificate changed. Refusing to publish an incompatible update."
            exit 1
          fi
          echo "APK_SIGNING_NOTE=Persistent key signing; certificate SHA-256 verified against the pinned development certificate." >> "$GITHUB_ENV"
          "$TOOLS/zipalign" -c -P 16 4 artifacts/LyriLayer-dev.apk
          "$TOOLS/aapt" dump badging artifacts/LyriLayer-dev.apk | grep -F "package: name='com.chaoseye.lyrilayer.debug'" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: LyriLayer-APK
          path: artifacts/LyriLayer-dev.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LyriLayer-Play-unsigned-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - name: Publish verified APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          APK="artifacts/LyriLayer-dev.apk"
          test -s "$APK"
          unzip -tq "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping published APK unchanged; increment versionName for a new release."
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a release. Refusing to publish against an unverified tag."
            exit 1
          fi
          NOTES="$(printf 'Automated Android development release (com.chaoseye.lyrilayer.debug).\n- Installs separately from com.chaoseye.lyrilayer; independent app data and permissions.\n\n- Version: %s\n- Commit: %s\n- Unit tests and APK build passed.\n- %s\n- Real-device validation pending.\n- Build: https://github.com/%s/actions/runs/%s\n' "$VERSION" "$GITHUB_SHA" "$APK_SIGNING_NOTE" "$GH_REPO" "$GITHUB_RUN_ID")"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "LyriLayer Dev $TAG" --notes "$NOTES" --prerelease
