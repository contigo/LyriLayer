name: LyriLayer APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lyrilayer-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/LyriLayer-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LyriLayer-APK
          path: artifacts/LyriLayer-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publish verified APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          APK="artifacts/LyriLayer-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping published APK unchanged; increment versionName for a new release."
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a release. Refusing to publish against an unverified tag."
            exit 1
          fi
          NOTES="$(printf 'Automated Android test release.\n\n- Version: %s\n- Commit: %s\n- Unit tests and APK build passed.\n- Debug-signed APK; real-device validation pending.\n- Updates require the same APK signing certificate.\n- Build: https://github.com/%s/actions/runs/%s\n' "$VERSION" "$GITHUB_SHA" "$GH_REPO" "$GITHUB_RUN_ID")"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "LyriLayer $TAG" --notes "$NOTES" --prerelease
