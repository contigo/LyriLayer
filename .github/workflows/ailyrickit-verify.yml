name: AILyricKit integration verification

on:
  push:
    branches: ['feature/ailyrickit-v21']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Rust Android toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
      - name: Test and build
        run: gradle :ailyrickit:testDebugUnitTest :ailyrickit:assembleRelease :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify only AILyricKit Whisper is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" > /tmp/ailyrickit-apk-files.txt
          grep -Fx 'lib/arm64-v8a/libailyrickit_whisper.so' /tmp/ailyrickit-apk-files.txt
          if grep -F 'liblyrilayer_whisper.so' /tmp/ailyrickit-apk-files.txt; then
            echo 'Legacy Whisper library is still packaged'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AILyricKit-AAR
          path: ailyrickit/build/outputs/aar/ailyrickit-release.aar
          retention-days: 7
          if-no-files-found: error
