name: LyricKit verification
on:
  push:
    branches: [feature/lyrickit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test
        run: gradle :lyrickit:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
