name: LyricKit verification
on:
  push:
    branches: [feature/lyrickit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test
        run: gradle :lyrickit:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LyricKit-verification-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Live Cyberpunk lyrics diagnostic
        env:
          LYRICKIT_LIVE_TEST: '1'
        run: |
          gradle :lyrickit:testDebugUnitTest --tests '*LiveSearchTest' --rerun-tasks --stacktrace
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('lyrickit/build/test-results/testDebugUnitTest/TEST-*LiveSearchTest.xml'):
              root = ET.parse(path).getroot()
              for node in root.iter('system-out'):
                  for line in (node.text or '').splitlines():
                      if line.startswith('LIVE '): print(line)
          PY
